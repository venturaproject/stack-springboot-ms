spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: identity-service
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8101}
              predicates:
                - Path=/api/auth/**
            - id: customer-service
              uri: ${CUSTOMER_SERVICE_URL:http://localhost:8102}
              predicates:
                - Path=/api/customers/**
            - id: catalog-service
              uri: ${CATALOG_SERVICE_URL:http://localhost:8103}
              predicates:
                - Path=/api/products/**
            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8104}
              predicates:
                - Path=/api/orders/**
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
