services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT_EXTERNAL:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: infrastructure/backend/Dockerfile.dev
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@example.com}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-admin123}
      JWT_ACCESS_TTL_SECS: ${JWT_ACCESS_TTL_SECS:-900}
      JWT_REFRESH_TTL_SECS: ${JWT_REFRESH_TTL_SECS:-604800}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      PORT: 8080
      MEDIA_DIR: /app/media
      SPRING_PROFILES_ACTIVE: dev
      # Lets the Testcontainers-based integration tests talk to the host Docker daemon
      # (the socket is bind-mounted below) and reach the containers they spawn.
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    volumes:
      - ./backend:/app
      - gradle_cache:/root/.gradle
      - gradle_build:/app/.gradle
      - ./backend/media:/app/media
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/frontend/Dockerfile
    command: sh -c "pnpm install --no-frozen-lockfile && pnpm run dev -- --host"
    environment:
      CI: "true"
      VITE_APP_NAME: ${VITE_APP_NAME:-Application}
      VITE_BACKEND_URL: ${VITE_BACKEND_URL}
      VITE_PUBLIC_API_URL: ""
      VITE_FULL_ACCESS_ROLES: ${VITE_FULL_ACCESS_ROLES:-ADMIN}
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    depends_on:
      - backend

  nginx:
    build:
      context: ./infrastructure/nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./backend/media:/srv/media:ro
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  gradle_cache:
  gradle_build:
  frontend_modules:
