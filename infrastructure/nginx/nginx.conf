# Only send "Connection: upgrade" for actual WebSocket requests (Vite HMR). Hardcoding it
# on every request makes newer Vite / Node hold the response open waiting for an upgrade
# handshake that never comes — every page load then stalls ~20s and nginx returns 504.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    location /media/ {
        alias /srv/media/;
        try_files $uri =404;
        types { image/jpeg jpg jpeg; image/png png; }
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }

    location /swagger-ui {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location /v3/api-docs {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite client-supplied forwarding headers; the backend trusts this value for
        # login throttling. Add real_ip/trusted-proxy configuration before placing an LB here.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
        proxy_redirect off;
        client_max_body_size 6M;
    }

    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
