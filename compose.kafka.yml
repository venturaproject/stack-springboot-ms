# Opt-in Kafka. Layer it on the dev stack:
#   docker compose -f compose.dev.yml -f compose.kafka.yml up -d
# The backend then runs with the `kafka` profile: KafkaAutoConfiguration is no longer
# excluded and the EventPublisher port resolves to KafkaEventPublisher instead of
# LoggingEventPublisher. Domain events drained from the outbox are published to one topic
# per aggregate — boilerplate.orders / boilerplate.products / boilerplate.customers /
# boilerplate.auth / boilerplate.api (auto-created) — keyed by event id, with the stable
# event type in an `event-type` header. SecurityEventConsumer (@Profile("kafka")) is an
# example @KafkaListener on boilerplate.auth.

services:
  kafka:
    image: apache/kafka:3.8.1
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    environment:
      SPRING_PROFILES_ACTIVE: dev,kafka
      APP_EVENTS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
