name: Release

# Tag a release: `git tag v1.2.3 && git push --tags`. Also runnable manually.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # create the GitHub Release
  packages: write        # push images to GHCR
  security-events: write # Trivy SARIF upload

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check monolith backend
        working-directory: backend
        run: ./gradlew check cyclonedxBom --no-daemon
        env:
          JWT_SECRET: ci-secret-key-minimum-32-characters-long
      - name: Build extracted services
        working-directory: backend
        run: ./gradlew buildServices --no-daemon --max-workers=1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Check frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
          pnpm run check:i18n
          pnpm run lint
          pnpm run test:run
          pnpm run build
      - name: Scan source and dependencies
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: '1'

  backend-image:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image (Jib, multi-arch)
        working-directory: backend
        run: >
          ./gradlew jib --no-daemon
          -Djib.to.tags=latest,${{ github.ref_name }}
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/backend
          IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}

      - name: Generate SBOM
        working-directory: backend
        run: ./gradlew cyclonedxBom --no-daemon

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/backend:${{ github.ref_name }}
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-backend.sarif
          exit-code: '1'

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-backend.sarif
          category: backend-image

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: backend/build/reports/bom.json

  frontend-image:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push frontend image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/nginx/Dockerfile.prod
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/frontend:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/frontend:${{ github.ref_name }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/frontend:${{ github.ref_name }}
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-frontend.sarif
          exit-code: '1'
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-frontend.sarif
          category: frontend-image

  github-release:
    needs: [backend-image, frontend-image]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sbom
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: bom.json
